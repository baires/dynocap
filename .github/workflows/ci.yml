name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: guest/go.sum
      - name: SwiftLint
        run: brew install swiftlint
      - name: Install
        run: |
          npm ci
          npm ci --prefix sdk/typescript
          npm ci --prefix sdk/mcp
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
