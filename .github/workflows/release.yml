name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: guest/go.sum
      - name: Package darwin-arm64
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/microvm-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "dist/microvm-${GITHUB_REF_NAME}-darwin-arm64.tar.gz.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Apple Silicon (darwin-arm64) CLI, guest tree, and guest image. Installers re-sign the CLI on the Mac that boots VMs. This workflow does not boot a VM."
